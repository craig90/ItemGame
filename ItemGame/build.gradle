plugins {
    id 'application'
}

group = 'com.craig.itemgame'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
}

application {
    mainClass.set('com.craig.itemgame.Launcher')
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.craig.itemgame.Launcher'
        )
    }
}