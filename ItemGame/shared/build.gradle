plugins {
    id 'java-library'
}

group = 'com.craig.itemgame'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // implementation files('lib/gson-2.13.1.jar')
    implementation 'com.google.code.gson:gson:2.13.1'
}
